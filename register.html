<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | EcoSmart</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="container nav"><a class="brand" href="index.html"><span>🍃</span>EcoSmart</a><nav class="links"><a href="index.html">Home</a><a href="login.html">Login</a></nav></div></header><main><section class="section auth-section"><div class="container auth-wrap"><div class="center"><div class="eyebrow">Join EcoSmart</div><h1>Create your account</h1><p>Start recycling responsibly and earning EcoPoints.</p></div><div class="card panel"><form id="registerForm"><div class="form-grid"><div class="field"><label>Full name</label><input id="regName" required autocomplete="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="regEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Mobile number</label><input id="regMobile" required autocomplete="tel" placeholder="+91"></div><div class="field"><label>Area</label><select id="regArea" required><option value="">Select area</option><option>Shivajinagar</option><option>Deccan</option><option>Camp</option><option>Swargate</option><option>Kothrud</option><option>Aundh</option><option>Baner</option><option>Pashan</option><option>Hinjewadi</option><option>Wakad</option><option>Koregaon Park</option><option>Kalyani Nagar</option><option>Kharadi</option><option>Katraj</option><option>Bibwewadi</option><option>Undri</option><option>Akurdi</option></select></div><div class="field full"><label>Password</label><input id="regPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div></div><button class="btn primary full-btn" style="margin-top:20px">Create account</button><p id="registerMessage" class="muted"></p></form></div></div></section></main><script src="app.js"></script></body></html>
